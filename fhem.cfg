#Source for VOC to AQI https://www.idt.com/document/whp/overview-tvoc-and-indoor-air-quality
#IDT IAQ Rating |	Reference Level |	Air Information				|	Action 						|	TVOC (mg/m3)	|	Air Quality
#-------------------------------------------------------------------------------------------------------------------------------
# ≤ 1.99 		|	Level 1 		|	Clean Hygienic Air 			|	No action required. 		|	< 0.3 			|	Very Good
#				|					|	(Target value)				|								|					|
# 2.00 – 2.99 	|	Level 2 		|	Good Air Quality 			|	Ventilation recommended.	|	0.3 – 1.0 		|	Good
#				|					|	(If no threshold			|								|					|
#				|					|	value is exceeded)			|								|					|
# 3.00 – 3.99 	|	Level 3 		|	Noticeable Comfort Concerns	| 	Ventilation required.  		|	1.0 – 3.0 		|	Medium
#				|					|	(Not recommended for 		|	Identify sources.			|					|
#				|					|	exposure > 12 months)		|								|					|
# 4.00 – 4.99 	|	Level 4 		|	Significant Comfort Issues 	|	Refresh air when possible.  |	3.0 – 10.0 		|	Poor
#				|					|	(Not recommended for 		|	Increase ventilation. 		|					|
#				|					|	exposure > 1 month)			|	A search for sources is required.				|
# ≥ 5.00 		|	Level 5 		|	Unacceptable Conditions  	|	Use only if unavoidable 	| 	> 10.0 			|	Bad
#				|					|	(Not recommended)			|	and only for short periods.	|					|
#Conversion from mg/m3 to ppm for most common TVOC is by the factor ca. 0.5; for example, 10mg/m3 equals ca. 5ppm.
#Conversion from ppm to ppb is by the factor 1000; for example, 0.1ppm equals 100ppb.
